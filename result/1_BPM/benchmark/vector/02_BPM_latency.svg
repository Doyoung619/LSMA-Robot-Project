   <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #61727d" x="86.399998" y="37.8" transform="rotate(-0 86.399998 37.8)">CPU PROCESSING LATENCY</text>
  </g>
  <g id="text_15">
   <text style="font-weight: 700; font-size: 23px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23333f" x="86.399998" y="71.28" transform="rotate(-0 86.399998 71.28)">Comparable to the fastest neural baseline</text>
  </g>
  <g id="text_16">
   <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #61727d" x="86.399998" y="98.28" transform="rotate(-0 86.399998 98.28)">Ours: 13.17 ms  ·  TempoCNN: 13.61 ms  ·  warm file-to-BPM processing</text>
  </g>
  <g id="text_17">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23333f" x="86.399998" y="464.4" transform="rotate(-0 86.399998 464.4)">Bars: medians. Whiskers: P95. Same 6 excerpts (2 tracks × 8/15/30 s), 1 CPU thread, 5 warm-ups + 20 repetitions each.</text>
  </g>
  <g id="text_18">
   <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #23333f" x="86.399998" y="483.3" transform="rotate(-0 86.399998 483.3)">Full file read, resampling, features, inference, decoding and BPM output included; downloads, initialization and JIT warm-up excluded.</text>
  </g>
  <g id="text_19">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #61727d" x="86.399998" y="508.68" transform="rotate(-0 86.399998 508.68)">TempoCNN k4 uses the documented TensorFlow frontend on Windows. The small median gap to Ours is a near tie, not a proven speed advantage.</text>
  </g>
