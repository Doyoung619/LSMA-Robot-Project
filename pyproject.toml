[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rita-robot-dance"
version = "0.2.0"
description = "CPU-only finite and continuous music-conditioned robot motion planners"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24,<3", "scipy>=1.10,<2", "soundfile>=0.12,<1", "sounddevice>=0.5,<1", "matplotlib>=3.7,<4", "PyYAML>=6,<7"]

[project.optional-dependencies]
misty = ["websocket-client>=1.7,<2"]

[project.scripts]
rita-dance = "rita_core.cli:main"

[tool.setuptools]
packages = ["rita_core", "rita_core.adapters", "rita_robot", "rita_finite", "rita_infinite", "rita_container"]
package-dir = {rita_core = "0_pre_and_etc/rita_core", rita_robot = "0_pre_and_etc/rita_robot", rita_finite = "1_finite_version/rita_finite", rita_infinite = "2_infinite_version/rita_infinite", rita_container = "6_container/rita_container"}

[tool.setuptools.package-data]
rita_core = ["profiles/*.json"]
rita_finite = ["*.json"]
