name: CPU contracts
on: [push, pull_request]
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libportaudio2
      - run: python -m pip install -e .
      - run: python 0_pre_and_etc/run.py test
      - run: python 0_pre_and_etc/run.py doctor --backend mock --read-only
      - run: python 0_pre_and_etc/run.py benchmark --suite quick --seconds 20
